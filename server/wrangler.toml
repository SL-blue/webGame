name = "paws-and-paychecks-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DEMO_MODE = "false"   # set to "true" for the class-exchange demo
# SIGNING_SECRET is a Wrangler secret, not a var — set it with:
#   npx wrangler secret put SIGNING_SECRET
# For local dev, copy server/.dev.vars.example to server/.dev.vars

[assets]
directory = "../client/dist"

[[durable_objects.bindings]]
name = "RUN"
class_name = "RunObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunObject"]

[[d1_databases]]
binding = "DB"
database_name = "paws-db"
database_id = "5375f814-5bc7-4cf2-8fcc-a6550cf0858c"
# To set up D1 (run from /server):
#   npx wrangler d1 create paws-db  → paste the returned id above
#   npx wrangler d1 execute paws-db --remote --file=migrations/0001_init.sql
# Local dev works without this — scoring still works, leaderboard returns []
